name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.caching=true
    -Dorg.gradle.parallel=true
    -Dorg.gradle.configureondemand=true
    -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── JDK with built-in Gradle cache ──────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── Gradle wrapper cache ────────────────────────────────────
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-

      # ── Gradle dependencies cache ──────────────────────────────
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-3
            ~/.gradle/caches/jars-9
          key: gradle-deps-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-

      # ── Gradle build cache ─────────────────────────────────────
      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/build-cache
          key: gradle-build-cache-${{ github.sha }}
          restore-keys: |
            gradle-build-cache-

      # ── Android SDK cache ──────────────────────────────────────
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/platform-tools
          key: android-sdk-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            android-sdk-

      # ── Kotlin compiler cache ──────────────────────────────────
      - name: Cache Kotlin compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/.kotlin
            ~/.konan
          key: kotlin-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            kotlin-

      # ── Grant execute permission ───────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Lint ───────────────────────────────────────────────────
      - name: Run lint
        run: ./gradlew lintDebug --build-cache --configuration-cache

      # ── Build debug APK ────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --build-cache --configuration-cache

      # ── Run unit tests ─────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --build-cache --configuration-cache

      # ── Upload debug APK ───────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ── Upload lint report ─────────────────────────────────────
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      # ── Stop Gradle daemons ────────────────────────────────────
      - name: Cleanup Gradle daemons
        if: always()
        run: ./gradlew --stop

  # ═══════════════════════════════════════════════════════════════
  #  Release build — only on push to main, requires signing secrets
  # ═══════════════════════════════════════════════════════════════
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── Reuse the same caches from the build job ───────────────
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-3
            ~/.gradle/caches/jars-9
          key: gradle-deps-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-

      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/build-cache
          key: gradle-build-cache-${{ github.sha }}
          restore-keys: |
            gradle-build-cache-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/platform-tools
          key: android-sdk-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            android-sdk-

      - name: Cache Kotlin compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/.kotlin
            ~/.konan
          key: kotlin-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            kotlin-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Decode keystore from base64 secret ─────────────────────
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore

      # ── Build signed release APK ───────────────────────────────
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --build-cache --configuration-cache

      # ── Upload signed release APK ──────────────────────────────
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── Cleanup ────────────────────────────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.keystore

      - name: Cleanup Gradle daemons
        if: always()
        run: ./gradlew --stop
