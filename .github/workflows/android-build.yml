name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.caching=true
    -Dorg.gradle.parallel=true
    -Dorg.gradle.configureondemand=true
    -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── JDK setup ──────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── Cache Gradle distribution (avoids re-downloading ~130MB) ─
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # ── Generate Gradle wrapper JAR if missing ─────────────────
      - name: Generate Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper JAR missing, generating..."
            GRADLE_VER=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/')
            # Check if distribution is already cached
            if ls ~/.gradle/wrapper/dists/gradle-${GRADLE_VER}-bin/*/gradle-${GRADLE_VER}/bin/gradle 2>/dev/null; then
              echo "Using cached Gradle distribution"
              CACHED_GRADLE=$(ls ~/.gradle/wrapper/dists/gradle-${GRADLE_VER}-bin/*/gradle-${GRADLE_VER}/bin/gradle | head -1)
              "$CACHED_GRADLE" wrapper --gradle-version ${GRADLE_VER}
            else
              echo "Downloading Gradle distribution..."
              curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /tmp/gradle
              /tmp/gradle/gradle-${GRADLE_VER}/bin/gradle wrapper --gradle-version ${GRADLE_VER}
              rm -rf /tmp/gradle /tmp/gradle.zip
            fi
          fi

      # ── Setup Gradle (caches dependencies + build cache) ───────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ── Grant execute permission ───────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Lint ───────────────────────────────────────────────────
      - name: Run lint
        run: ./gradlew lintDebug --build-cache

      # ── Build debug APK ────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --build-cache

      # ── Run unit tests ─────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --build-cache

      # ── Upload debug APK ───────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ── Upload lint report ─────────────────────────────────────
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  #  Release build — only on push to main, requires signing secrets
  # ═══════════════════════════════════════════════════════════════
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── Cache Gradle distribution ──────────────────────────────
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Generate Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            GRADLE_VER=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/')
            if ls ~/.gradle/wrapper/dists/gradle-${GRADLE_VER}-bin/*/gradle-${GRADLE_VER}/bin/gradle 2>/dev/null; then
              CACHED_GRADLE=$(ls ~/.gradle/wrapper/dists/gradle-${GRADLE_VER}-bin/*/gradle-${GRADLE_VER}/bin/gradle | head -1)
              "$CACHED_GRADLE" wrapper --gradle-version ${GRADLE_VER}
            else
              curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /tmp/gradle
              /tmp/gradle/gradle-${GRADLE_VER}/bin/gradle wrapper --gradle-version ${GRADLE_VER}
              rm -rf /tmp/gradle /tmp/gradle.zip
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Decode keystore from base64 secret ─────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > ${{ github.workspace }}/release.keystore
          echo "Keystore size: $(wc -c < ${{ github.workspace }}/release.keystore) bytes"
          # Verify it's a valid keystore
          keytool -list -keystore ${{ github.workspace }}/release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" || echo "Keystore verification failed"

      # ── Build signed release APK ───────────────────────────────
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --build-cache

      # ── Upload signed release APK ──────────────────────────────
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── Create GitHub Release with APK download ────────────────
      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]*//g')
          BUILD_NUM=${{ github.run_number }}
          TAG="v${VERSION_NAME}-build.${BUILD_NUM}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=Release ${VERSION_NAME} (Build ${BUILD_NUM})" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## AndroidPoc Release

            **Version:** ${{ steps.version.outputs.tag }}
            **Commit:** ${{ github.sha }}

            ### Download
            Download the APK file below and install it on your Android device.

            > To install, you may need to enable "Install from unknown sources" in your device settings.
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Cleanup ────────────────────────────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.keystore
